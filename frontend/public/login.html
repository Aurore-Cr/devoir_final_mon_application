<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <title>JAMES — Connexion</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#040810" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-logo">
        <div class="logo-ring"></div>
        <span class="logo-text">JAMES</span>
        <p class="logo-sub">Assistant Personnel</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Connexion</button>
        <button class="auth-tab" data-tab="register">Créer un compte</button>
      </div>

      <!-- LOGIN -->
      <div class="auth-form" id="form-login">
        <div class="field-group">
          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            placeholder="ton@email.fr"
            autocomplete="email"
            inputmode="email"
          />
        </div>
        <div class="field-group">
          <label for="login-password">Mot de passe</label>
          <div class="pw-wrap">
            <input
              type="password"
              id="login-password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button class="pw-toggle" type="button">👁</button>
          </div>
        </div>
        <div class="auth-error" id="login-error"></div>
        <button class="auth-btn" id="btn-login">Se connecter</button>
        <p class="auth-hint">
          Chaque compte a son propre planning et ses propres données.
        </p>
      </div>

      <!-- REGISTER -->
      <div class="auth-form hidden" id="form-register">
        <div class="field-group">
          <label for="reg-username">Nom d'utilisateur</label>
          <input
            type="text"
            id="reg-username"
            placeholder="Mon_Pseudo"
            autocomplete="username"
            autocapitalize="off"
          />
        </div>
        <div class="field-group">
          <label for="reg-email">Email</label>
          <input
            type="email"
            id="reg-email"
            placeholder="ton@email.fr"
            autocomplete="email"
          />
        </div>
        <div class="field-group">
          <label for="reg-password"
            >Mot de passe <small>(6 car. min)</small></label
          >
          <div class="pw-wrap">
            <input
              type="password"
              id="reg-password"
              placeholder="••••••••"
              autocomplete="new-password"
            />
            <button class="pw-toggle" type="button">👁</button>
          </div>
        </div>
        <div class="auth-error" id="register-error"></div>
        <button class="auth-btn" id="btn-register">Créer mon compte</button>
        <p class="auth-hint">
          Un planning par défaut sera créé automatiquement. Tu pourras le
          personnaliser dans Paramètres.
        </p>
      </div>
    </div>
    <script src="/js/auth.js"></script>
  </body>
</html>
